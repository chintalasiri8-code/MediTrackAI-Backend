server:
  port: ${PORT:8080}

spring:
  application:
    name: meditrack-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/meditrack_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

meditrack:
  upload:
    dir: ./uploads
  gemini:
    api-key: ${GEMINI_API_KEY:DEMO_KEY}
  fcm:
    enabled: false

app:
  jwtSecret: ${JWT_SECRET:meditrack-ai-default-secure-jwt-secret-key-32bytes-min-2026}
  jwtExpirationInMs: 86400000
